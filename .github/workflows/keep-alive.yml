name: Keep Alive (Prevent Render Spin-Down)

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging backend..."
          curl -s -o /dev/null -w "Backend: HTTP %{http_code}\n" https://ai-interviewer-backend-y6ks.onrender.com/api/auth/login || echo "Backend unreachable"
          
      - name: Ping AI Service
        run: |
          echo "Pinging AI service..."
          curl -s -o /dev/null -w "AI Service: HTTP %{http_code}\n" https://ai-interviewer-ai-service-qpxr.onrender.com/ai/voices || echo "AI Service unreachable"
