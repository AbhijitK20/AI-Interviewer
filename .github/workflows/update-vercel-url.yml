name: Update Vercel URL in README

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README with latest Vercel URL
        run: |
          # The production URL stays the same
          PROD_URL="https://ai-interviewer-rho-hazel.vercel.app"
          sed -i "s|https://[^)]*vercel.app|$PROD_URL|g" README.md
          echo "Vercel URL in README: $PROD_URL"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update Vercel URL in README"
          git push
