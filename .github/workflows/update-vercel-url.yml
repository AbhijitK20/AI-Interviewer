name: Update Vercel URL in README

on:
  deployment_status:
    types: [completed]

jobs:
  update-readme:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Vercel URL
        id: vercel
        run: |
          URL="${{ github.event.deployment_status.target_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Vercel URL: $URL"

      - name: Update README
        run: |
          sed -i "s|https://[^)]*vercel.app|${{ steps.vercel.outputs.url }}|g" README.md
          sed -i "s|\[Live Demo\](https://[^)]*)|[Live Demo](${{ steps.vercel.outputs.url }})|g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update Vercel URL in README"
          git push
