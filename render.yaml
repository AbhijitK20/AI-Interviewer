services:
  - type: web
    name: ai-interviewer-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/ai_interviewer?ssl=true&sslMode=VERIFY_IDENTITY&createDatabaseIfNotExist=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: 4HWh5suR69uiJcE.root
      - key: SPRING_DATASOURCE_PASSWORD
        value: VQ6wHPQ7YHRuqmjF
      - key: AI_SERVICE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: ai-interviewer-ai-service
    runtime: docker
    plan: free
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: TTS_PROVIDER
        value: edge
      - key: STT_PROVIDER
        value: deepgram
