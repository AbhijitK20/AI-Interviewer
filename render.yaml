services:
  - type: web
    name: ai-interviewer-backend
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar --server.port=$PORT
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_VERSION
        value: openjdk21
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ai-interviewer-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ai-interviewer-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ai-interviewer-db
          property: password
      - key: AI_SERVICE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: ai-interviewer-ai-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: TTS_PROVIDER
        value: edge
      - key: STT_PROVIDER
        value: deepgram
      - key: DEEPGRAM_API_KEY
        sync: false

  - type: postgres
    name: ai-interviewer-db
    plan: free
    databaseName: ai_interviewer
    ipAllowList: []
