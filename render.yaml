services:
  - type: web
    name: ai-interviewer-backend
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar --server.port=$PORT
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_VERSION
        value: openjdk21
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/ai_interviewer?ssl=true&sslMode=VERIFY_IDENTITY&createDatabaseIfNotExist=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: 4HWh5suR69uiJcE.root
      - key: SPRING_DATASOURCE_PASSWORD
        value: VQ6wHPQ7YHRuqmjF
      - key: AI_SERVICE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: ai-interviewer-ai-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: TTS_PROVIDER
        value: edge
      - key: STT_PROVIDER
        value: deepgram
