spring.application.name=ai-interviewer-backend
server.port=8082

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_interviewer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Abhi@20000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - Use environment variable in production
app.jwt.secret=${JWT_SECRET:aGl0aGlzSXNBVmVyeVNlY3VyZVNlY3JldEtleUZvckFJSW50ZXJ2aWV3ZXJBcHBsaWNhdGlvbjIwMjQ=}
app.jwt.expiration-ms=86400000

# AI Service
ai.service.url=http://localhost:8001

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Judge0 Code Execution
judge0.api.url=https://ce.judge0.com
judge0.api.key=${JUDGE0_API_KEY:}

# Deepgram STT
deepgram.api.key=${DEEPGRAM_API_KEY:}

# ElevenLabs TTS
elevenlabs.api.key=${ELEVENLABS_API_KEY:}

# Rate Limiting (requests per minute)
app.rate-limit.enabled=true
app.rate-limit.max-requests-per-minute=60

# Security headers
app.security.headers.strict-transport-security=true
app.security.headers.content-security-policy=default-src 'self'
app.security.headers.x-content-type-options=nosniff
app.security.headers.x-frame-options=DENY

# Logging
logging.level.com.interviewer=WARN
logging.level.org.springframework.security=WARN
